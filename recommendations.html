<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendation Report - FinSense AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div id="app-navbar"></div>
<div class="container mt-3"><div id="flash-container"></div></div>

<main class="flex-grow-1">
<div class="container py-4" id="recomRoot"></div>
</main>

<div id="app-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script>
    renderChrome('recommendations');
    const user = FS.requireUser();

    function riskHeader(level) {
        if (level === 'Low') return '<span class="text-emerald"><i class="fa-solid fa-shield-check me-1"></i> Low Risk</span>';
        if (level === 'Moderate') return '<span class="text-warning"><i class="fa-solid fa-triangle-exclamation me-1"></i> Moderate</span>';
        return '<span class="text-danger"><i class="fa-solid fa-circle-exclamation me-1"></i> High Risk</span>';
    }

    if (user) {
        const params = new URLSearchParams(window.location.search);
        const predId = parseInt(params.get('id'), 10);
        const pred = FS.getPrediction(predId);

        if (!pred || pred.user_id !== user.id) {
            document.getElementById('recomRoot').innerHTML = `
                <div class="glass-card p-5 text-center">
                    <h4 class="text-white">Report Not Found</h4>
                    <p class="text-muted">This recommendation report doesn't exist or isn't linked to your account.</p>
                    <a href="dashboard.html" class="btn btn-primary-custom mt-2">Back to Dashboard</a>
                </div>`;
        } else {
            const loans = pred.banking_products || [];
            const insurances = pred.insurance_plans || [];
            const schemes = pred.matched_schemes || [];

            document.getElementById('recomRoot').innerHTML = `
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <div>
                    <span class="badge badge-custom badge-low mb-1">Generated Assessment Report</span>
                    <h2 class="fw-bold mb-0">AI Financial & Crop Recommendation Report</h2>
                </div>
                <div class="d-flex gap-2">
                    <button id="exportPdfBtn" class="btn btn-outline-glass"><i class="fa-solid fa-file-pdf me-2 text-danger"></i> Export PDF Report</button>
                    <button id="emailReportBtn" class="btn btn-emerald"><i class="fa-solid fa-envelope me-2"></i> Email Report</button>
                </div>
            </div>

            <div class="glass-card p-4 mb-4">
                <div class="row align-items-center g-4">
                    <div class="col-md-3 text-center border-end border-secondary">
                        <span class="text-muted small">Financial Risk Index</span>
                        <h2 class="fw-bold mb-1 mt-1">${riskHeader(pred.risk_level)}</h2>
                        <div class="small text-muted">Risk Score: ${pred.risk_score}/100</div>
                    </div>
                    <div class="col-md-3 text-center border-end border-secondary">
                        <span class="text-muted small">Loan Approval Probability</span>
                        <h2 class="fw-bold text-cyan mb-1 mt-1">${pred.loan_eligibility_score}%</h2>
                        <div class="small text-muted">Credit Subvention Fit</div>
                    </div>
                    <div class="col-md-3 text-center border-end border-secondary">
                        <span class="text-muted small">Insurance Need Score</span>
                        <h2 class="fw-bold text-warning mb-1 mt-1">${pred.insurance_need_score}%</h2>
                        <div class="small text-muted">Yield & Health Shield</div>
                    </div>
                    <div class="col-md-3 text-center">
                        <span class="text-muted small">AI Confidence Level</span>
                        <h2 class="fw-bold text-info mb-1 mt-1">${pred.prediction_confidence}%</h2>
                        <div class="small text-muted">Scoring Engine Accuracy</div>
                    </div>
                </div>
            </div>

            <div class="glass-card p-4 mb-4">
                <h5 class="fw-bold text-white mb-2"><i class="fa-solid fa-brain text-cyan me-2"></i> AI Decision Explanation & Strategy</h5>
                <div class="p-3 glass-card bg-dark bg-opacity-50 border-0 rounded-3 text-light font-monospace small" style="white-space: pre-line;">${escapeHtml(pred.ai_explanation)}</div>
            </div>

            <ul class="nav nav-pills mb-4 gap-2 border-bottom border-secondary pb-3" id="recomTabs" role="tablist">
                <li class="nav-item"><button class="nav-link active px-4" id="loans-tab" data-bs-toggle="tab" data-bs-target="#loans" type="button"><i class="fa-solid fa-building-columns me-2"></i> Banking & Loans (${loans.length})</button></li>
                <li class="nav-item"><button class="nav-link px-4" id="insurance-tab" data-bs-toggle="tab" data-bs-target="#insurance" type="button"><i class="fa-solid fa-shield-virus me-2"></i> Insurance Plans (${insurances.length})</button></li>
                <li class="nav-item"><button class="nav-link px-4" id="schemes-tab" data-bs-toggle="tab" data-bs-target="#schemes" type="button"><i class="fa-solid fa-landmark me-2"></i> Government Schemes (${schemes.length})</button></li>
            </ul>

            <div class="tab-content" id="recomTabContent">
                <div class="tab-pane fade show active" id="loans" role="tabpanel">
                    <div class="row g-4">
                        ${loans.map(loan => `
                        <div class="col-lg-6"><div class="glass-card p-4 h-100 d-flex flex-column justify-content-between">
                            <div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge bg-primary bg-opacity-25 text-info">${escapeHtml(loan.category)}</span>
                                    <span class="badge bg-success bg-opacity-25 text-success font-monospace">${loan.eligibility_match}% Match</span>
                                </div>
                                <h4 class="fw-bold text-white mb-1">${escapeHtml(loan.product_name)}</h4>
                                <p class="text-muted small mb-1">${escapeHtml(loan.provider_name)}</p>
                                <p class="text-muted small mb-3">${escapeHtml(loan.description)}</p>
                                <div class="row g-2 mb-3 small">
                                    <div class="col-6"><div class="p-2 glass-card bg-dark bg-opacity-40 border-0"><span class="text-muted d-block">Interest Rate</span><strong class="text-emerald">${escapeHtml(loan.interest_rate)}</strong></div></div>
                                    <div class="col-6"><div class="p-2 glass-card bg-dark bg-opacity-40 border-0"><span class="text-muted d-block">Max Loan Amount</span><strong class="text-cyan">${loan.max_amount ? inr(loan.max_amount) : 'Flexible'}</strong></div></div>
                                </div>
                            </div>
                            <button class="btn btn-outline-glass btn-sm w-100 mt-2" onclick="showToast('success', 'Application details sent to bank provider.')">Apply / Enquire Now <i class="fa-solid fa-external-link ms-1"></i></button>
                        </div></div>`).join('')}
                    </div>
                </div>

                <div class="tab-pane fade" id="insurance" role="tabpanel">
                    <div class="row g-4">
                        ${insurances.map(ins => `
                        <div class="col-lg-6"><div class="glass-card p-4 h-100 d-flex flex-column justify-content-between">
                            <div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge bg-warning bg-opacity-25 text-warning">${escapeHtml(ins.insurance_type)}</span>
                                    <span class="badge bg-info bg-opacity-25 text-info font-monospace">${ins.match_score}% Match</span>
                                </div>
                                <h4 class="fw-bold text-white mb-1">${escapeHtml(ins.plan_name)}</h4>
                                <span class="small text-muted d-block mb-2"><i class="fa-solid fa-building me-1"></i> ${escapeHtml(ins.provider)}</span>
                                <p class="text-muted small mb-3">${escapeHtml(ins.features)}</p>
                                <div class="row g-2 mb-3 small">
                                    <div class="col-6"><div class="p-2 glass-card bg-dark bg-opacity-40 border-0"><span class="text-muted d-block">Sum Insured</span><strong class="text-emerald">${inr(ins.sum_insured)}</strong></div></div>
                                    <div class="col-6"><div class="p-2 glass-card bg-dark bg-opacity-40 border-0"><span class="text-muted d-block">Annual Premium</span><strong class="text-warning">${inr(ins.annual_premium)}</strong></div></div>
                                </div>
                            </div>
                            <button class="btn btn-emerald btn-sm w-100 mt-2" onclick="showToast('success', 'Insurance claim & policy registration started.')">Enroll Policy <i class="fa-solid fa-shield me-1"></i></button>
                        </div></div>`).join('')}
                    </div>
                </div>

                <div class="tab-pane fade" id="schemes" role="tabpanel">
                    <div class="row g-4">
                        ${schemes.map(scheme => `
                        <div class="col-lg-6"><div class="glass-card p-4 h-100 d-flex flex-column justify-content-between">
                            <div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge bg-success bg-opacity-25 text-success">${escapeHtml(scheme.category)}</span>
                                    ${scheme.is_eligible
                                        ? `<span class="badge badge-custom badge-low"><i class="fa-solid fa-check me-1"></i> Eligible (${scheme.match_score}%)</span>`
                                        : `<span class="badge badge-custom badge-moderate">Partial Match (${scheme.match_score}%)</span>`}
                                </div>
                                <h4 class="fw-bold text-white mb-1">${escapeHtml(scheme.scheme_name)}</h4>
                                <p class="text-muted small mb-2">${escapeHtml(scheme.description)}</p>
                                <div class="p-3 glass-card bg-dark bg-opacity-50 border-0 rounded-3 mb-3 small">
                                    <div class="text-info fw-bold mb-1"><i class="fa-solid fa-gift me-1"></i> Benefit: ${escapeHtml(scheme.financial_benefit)}</div>
                                    <div class="text-muted"><i class="fa-solid fa-circle-info me-1"></i> ${escapeHtml(scheme.eligibility_criteria)}</div>
                                </div>
                            </div>
                            ${scheme.official_url ? `<a href="${scheme.official_url}" target="_blank" rel="noopener" class="btn btn-outline-glass btn-sm w-100">Official Portal <i class="fa-solid fa-arrow-up-right-from-square ms-1"></i></a>` : ''}
                        </div></div>`).join('')}
                    </div>
                </div>
            </div>`;

            document.getElementById('exportPdfBtn').addEventListener('click', () => FS.exportPredictionPdf(pred));
            document.getElementById('emailReportBtn').addEventListener('click', () => {
                FS.logActivity(user.id, 'Report Emailed', `Sent report #${pred.id} to ${user.email}`);
                flashMessage(`Recommendation report successfully emailed to ${user.email}!`, 'success');
            });
        }
    }
</script>
</body>
</html>
