<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - FinSense AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div id="app-navbar"></div>
<div class="container mt-3"><div id="flash-container"></div></div>

<main class="flex-grow-1">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5" data-aos="zoom-in">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="stat-icon mx-auto mb-3 text-warning fs-3"><i class="fa-solid fa-key"></i></div>
                    <h3 class="fw-bold">Forgot Password?</h3>
                    <p class="text-muted small">Enter your registered email or mobile to receive a demo OTP verification code.</p>
                </div>

                <form id="forgotForm">
                    <div class="mb-3">
                        <label class="form-label">Email or Mobile Number</label>
                        <input type="text" name="identity" class="form-control" placeholder="user@gmail.com" required>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary-custom btn-lg">
                            <i class="fa-solid fa-paper-plane me-2"></i> Send OTP Code
                        </button>
                    </div>
                </form>

                <div class="text-center text-muted small mt-4">
                    Remembered password? <a href="login.html" class="text-cyan text-decoration-none fw-bold">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
</main>

<div id="app-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script>
    renderChrome('forgot');

    document.getElementById('forgotForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const identity = e.target.identity.value.trim();
        const result = FS.forgotPassword(identity);
        if (result.ok) {
            flashMessage(`Verification OTP sent! (Demo OTP Code: ${result.otp})`, 'success');
        } else {
            flashMessage(result.error, 'error');
        }
    });
</script>
</body>
</html>
