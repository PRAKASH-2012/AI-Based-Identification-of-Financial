<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - FinSense AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div id="app-navbar"></div>
<div class="container mt-3"><div id="flash-container"></div></div>

<main class="flex-grow-1">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8" data-aos="fade-up">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="badge badge-custom badge-low mb-2">Create Account</span>
                    <h3 class="fw-bold">Register for FinSense AI</h3>
                    <p class="text-muted small">Fill in your basic demographics to unlock instant AI financial & insurance recommendations</p>
                </div>

                <form id="registerForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input type="text" name="full_name" class="form-control" placeholder="Enter your name" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Age <span class="text-danger">*</span></label>
                            <input type="number" name="age" class="form-control" min="18" max="100" placeholder="Age" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Gender <span class="text-danger">*</span></label>
                            <select name="gender" class="form-select" required>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Mobile Number <span class="text-danger">*</span></label>
                            <input type="tel" name="mobile" class="form-control" placeholder="9876543210" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email Address <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control" placeholder="Enter your mail" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="password" name="password" id="regPassword" class="form-control" placeholder="At least 6 chars" required minlength="6">
                                <button class="btn btn-outline-secondary border-secondary toggle-password" type="button" data-target="regPassword">
                                    <i class="fa-solid fa-eye text-muted"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Occupation <span class="text-danger">*</span></label>
                            <select name="occupation" class="form-select" required>
                                <option value="Farmer">Farmer / Agriculture</option>
                                <option value="Salaried">Salaried Employee</option>
                                <option value="Self-Employed / Business">Self-Employed / Business</option>
                                <option value="Laborer">Daily Wage Laborer</option>
                                <option value="Student / Unemployed">Student / Unemployed</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Annual Income (₹) <span class="text-danger">*</span></label>
                            <input type="number" name="annual_income" class="form-control" placeholder="250000" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Family Members</label>
                            <input type="number" name="family_members" class="form-control" min="1" value="4">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Education Level</label>
                            <select name="education" class="form-select">
                                <option value="Primary / Secondary">Primary / High School</option>
                                <option value="Graduate">Graduate / Degree</option>
                                <option value="Post Graduate">Post Graduate</option>
                                <option value="No Formal Education">No Formal Education</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">District</label>
                            <input type="text" name="district" class="form-control" placeholder="Namakkal,Karur, etc.">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">State</label>
                            <input type="text" name="state" class="form-control" placeholder="Tamil Nadu, Kerala, etc.">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <input type="text" name="address" class="form-control" placeholder="Village / Town, Landmark">
                        </div>
                        <div class="col-12 text-center mt-4">
                            <button type="submit" class="btn btn-emerald btn-lg px-5">
                                <i class="fa-solid fa-user-plus me-2"></i> Register Account
                            </button>
                        </div>
                    </div>
                </form>

                <div class="text-center text-muted small mt-4">
                    Already registered? <a href="login.html" class="text-cyan text-decoration-none fw-bold">Sign In Here</a>
                </div>
            </div>
        </div>
    </div>
</div>
</main>

<div id="app-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script>
    renderChrome('register');

    document.getElementById('registerForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const f = e.target;
        const data = {
            full_name: f.full_name.value, age: f.age.value, gender: f.gender.value,
            mobile: f.mobile.value, email: f.email.value, password: f.password.value,
            address: f.address.value, district: f.district.value, state: f.state.value,
            occupation: f.occupation.value, annual_income: f.annual_income.value,
            family_members: f.family_members.value, education: f.education.value
        };
        const result = FS.registerUser(data);
        if (result.ok) {
            showToast('success', 'Registration successful! Please log in to continue.');
            setTimeout(() => { window.location.href = 'login.html'; }, 500);
        } else {
            flashMessage(result.error, 'error');
        }
    });
</script>
</body>
</html>
