<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - FinSense AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div id="app-navbar"></div>
<div class="container mt-3"><div id="flash-container"></div></div>

<main class="flex-grow-1">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8" data-aos="fade-up">
            <div class="glass-card p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4 border-bottom border-secondary pb-3">
                    <div class="stat-icon bg-info bg-opacity-25 text-info fs-3"><i class="fa-solid fa-id-card"></i></div>
                    <div>
                        <h3 class="fw-bold mb-0">User Profile Settings</h3>
                        <p class="text-muted small mb-0">Manage your contact information and demographic details</p>
                    </div>
                </div>

                <form id="profileForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="full_name" id="p_full_name" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Age</label>
                            <input type="number" name="age" id="p_age" class="form-control" min="18" max="100" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Gender</label>
                            <select name="gender" id="p_gender" class="form-select" required>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Mobile Number</label>
                            <input type="tel" name="mobile" id="p_mobile" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" id="p_email" class="form-control" required readonly>
                            <div class="form-text text-muted small">Email address cannot be changed.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Occupation</label>
                            <select name="occupation" id="p_occupation" class="form-select" required>
                                <option value="Farmer">Farmer / Agriculture</option>
                                <option value="Salaried">Salaried Employee</option>
                                <option value="Self-Employed / Business">Self-Employed / Business</option>
                                <option value="Laborer">Daily Wage Laborer</option>
                                <option value="Student / Unemployed">Student / Unemployed</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Annual Income (₹)</label>
                            <input type="number" name="annual_income" id="p_income" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">District</label>
                            <input type="text" name="district" id="p_district" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">State</label>
                            <input type="text" name="state" id="p_state" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <input type="text" name="address" id="p_address" class="form-control">
                        </div>
                        <div class="col-12 text-end mt-4">
                            <button type="submit" class="btn btn-primary-custom px-5"><i class="fa-solid fa-floppy-disk me-2"></i> Save Profile Changes</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</main>

<div id="app-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script>
    renderChrome('profile');
    const user = FS.requireUser();

    if (user) {
        document.getElementById('p_full_name').value = user.full_name || '';
        document.getElementById('p_age').value = user.age || '';
        document.getElementById('p_gender').value = user.gender || 'Male';
        document.getElementById('p_mobile').value = user.mobile || '';
        document.getElementById('p_email').value = user.email || '';
        document.getElementById('p_occupation').value = user.occupation || 'Farmer';
        document.getElementById('p_income').value = user.annual_income || '';
        document.getElementById('p_district').value = user.district || '';
        document.getElementById('p_state').value = user.state || '';
        document.getElementById('p_address').value = user.address || '';

        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const f = e.target;
            FS.updateUser(user.id, {
                full_name: f.full_name.value, age: parseInt(f.age.value, 10), gender: f.gender.value,
                mobile: f.mobile.value, occupation: f.occupation.value,
                annual_income: parseFloat(f.annual_income.value), district: f.district.value,
                state: f.state.value, address: f.address.value
            });
            const session = FS.getSession();
            session.user_name = f.full_name.value;
            FS.setSession(session);
            flashMessage('Profile updated successfully!', 'success');
            showToast('success', 'Profile updated successfully!');
        });
    }
</script>
</body>
</html>
