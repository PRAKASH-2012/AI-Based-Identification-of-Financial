<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - FinSense AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div id="app-navbar"></div>
<div class="container mt-3"><div id="flash-container"></div></div>

<main class="flex-grow-1">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5" data-aos="zoom-in">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="stat-icon mx-auto mb-3 text-cyan fs-3"><i class="fa-solid fa-lock"></i></div>
                    <h3 class="fw-bold">Sign In to FinSense AI</h3>
                    <p class="text-muted small">Access your financial assessment dashboard & scheme predictions</p>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Select Role</label>
                        <select name="role" class="form-select" id="roleSelect">
                            <option value="user">User / Farmer</option>
                            <option value="admin">System Administrator</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email or Mobile</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-user"></i></span>
                            <input type="text" name="identity" class="form-control" placeholder="user@gmail.com or 9876543210" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label mb-0">Password</label>
                            <a href="forgot-password.html" class="small text-cyan text-decoration-none">Forgot Password?</a>
                        </div>
                        <div class="input-group mt-1">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-key"></i></span>
                            <input type="password" name="password" id="loginPassword" class="form-control" placeholder="Enter password" required>
                            <button class="btn btn-outline-secondary border-secondary toggle-password" type="button" data-target="loginPassword">
                                <i class="fa-solid fa-eye text-muted"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary-custom btn-lg">
                            <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
                        </button>
                    </div>
                </form>

                <hr class="border-secondary my-4">

                <div class="p-3 glass-card bg-dark bg-opacity-50 border-0 rounded-3 mb-3">
                    <div class="small fw-bold text-muted mb-2 text-center"><i class="fa-solid fa-bolt text-warning me-1"></i> Quick Demo Access</div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-glass flex-grow-1 small" onclick="fillDemo('user')">Demo User</button>
                        <button class="btn btn-sm btn-outline-glass flex-grow-1 small" onclick="fillDemo('admin')">Demo Admin</button>
                    </div>
                    <div class="small text-muted text-center mt-2">Demo User requires you to register first (or use Demo Admin: admin@finsense.ai / admin123)</div>
                </div>

                <div class="text-center text-muted small">
                    Don't have an account? <a href="register.html" class="text-cyan text-decoration-none fw-bold">Register Now</a>
                </div>
            </div>
        </div>
    </div>
</div>
</main>

<div id="app-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script>
    renderChrome('login');

    // Preselect admin role if ?admin=true
    const params = new URLSearchParams(window.location.search);
    if (params.get('admin') === 'true') {
        document.getElementById('roleSelect').value = 'admin';
    }

    function fillDemo(role) {
        const roleSelect = document.getElementById('roleSelect');
        const identityInput = document.querySelector('input[name="identity"]');
        const passwordInput = document.getElementById('loginPassword');
        if (role === 'user') {
            roleSelect.value = 'user';
            identityInput.value = 'farmer@gmail.com';
            passwordInput.value = 'user123';
        } else {
            roleSelect.value = 'admin';
            identityInput.value = 'admin@finsense.ai';
            passwordInput.value = 'admin123';
        }
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const form = e.target;
        const role = form.role.value;
        const identity = form.identity.value.trim();
        const password = form.password.value;

        const result = FS.login(role, identity, password);
        if (result.ok) {
            showToast('success', 'Welcome back!');
            setTimeout(() => {
                window.location.href = role === 'admin' ? 'admin.html' : 'dashboard.html';
            }, 400);
        } else {
            flashMessage(result.error, 'error');
        }
    });
</script>
</body>
</html>
