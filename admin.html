<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - FinSense AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div id="app-navbar"></div>
<div class="container mt-3"><div id="flash-container"></div></div>

<main class="flex-grow-1">
<div class="container py-4" id="adminRoot"></div>
</main>

<div id="app-footer"></div>

<!-- Modal: Add New Scheme (static, outside re-rendered root so Bootstrap modal instance stays stable) -->
<div class="modal fade" id="addSchemeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content glass-card text-white">
            <div class="modal-header border-secondary">
                <h5 class="modal-header-title fw-bold"><i class="fa-solid fa-plus me-2 text-cyan"></i> Add New Government Scheme</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="addSchemeForm">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Scheme Name</label>
                            <input type="text" name="scheme_name" class="form-control" placeholder="e.g. Kisan Samriddhi Yojana" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <input type="text" name="category" class="form-control" placeholder="Agriculture / Insurance / Credit" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Target Occupation</label>
                            <input type="text" name="target_occupation" class="form-control" placeholder="Farmer / All Occupations" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Financial Benefit</label>
                            <input type="text" name="financial_benefit" class="form-control" placeholder="₹10,000 subsidy per acre" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Eligibility Criteria</label>
                            <textarea name="eligibility_criteria" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Official Portal URL</label>
                            <input type="url" name="official_url" class="form-control" placeholder="https://myscheme.gov.in">
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-outline-glass" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary-custom">Save Scheme</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
<script>
    renderChrome('admin');
    const adminSession = FS.requireAdmin();

    function renderAdminPage() {
        if (!adminSession) return;
        const users = FS.getAllUsers();
        const predictions = FS.getAllPredictions();
        const schemes = FS.getSchemes();
        const logs = FS.getLogs();

        document.getElementById('adminRoot').innerHTML = `
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <span class="badge bg-danger bg-opacity-25 text-danger border border-danger border-opacity-50 mb-1">Super Administrator</span>
                <h2 class="fw-bold mb-0">FinSense AI Command Center</h2>
            </div>
            <div class="d-flex gap-2">
                <button id="exportCsvBtn" class="btn btn-outline-glass"><i class="fa-solid fa-file-csv me-2 text-success"></i> Export System CSV</button>
                <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#addSchemeModal"><i class="fa-solid fa-plus me-2"></i> Add Govt Scheme</button>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-3 col-6"><div class="glass-card p-3 stat-card">
                <span class="text-muted small">Total Registered Users</span>
                <h3 class="fw-bold text-cyan mb-0 mt-1">${users.length}</h3>
                <div class="small text-muted mt-1">Active Accounts</div>
            </div></div>
            <div class="col-md-3 col-6"><div class="glass-card p-3 stat-card">
                <span class="text-muted small">Total AI Predictions</span>
                <h3 class="fw-bold text-emerald mb-0 mt-1">${predictions.length}</h3>
                <div class="small text-muted mt-1">Processed Reports</div>
            </div></div>
            <div class="col-md-3 col-6"><div class="glass-card p-3 stat-card">
                <span class="text-muted small">Active Schemes</span>
                <h3 class="fw-bold text-warning mb-0 mt-1">${schemes.length}</h3>
                <div class="small text-muted mt-1">Govt Programs</div>
            </div></div>
            <div class="col-md-3 col-6"><div class="glass-card p-3 stat-card">
                <span class="text-muted small">System Health</span>
                <h3 class="fw-bold text-emerald mb-0 mt-1">100%</h3>
                <div class="small text-muted mt-1">Client-Side Engine Online</div>
            </div></div>
        </div>

        <ul class="nav nav-pills mb-4 gap-2 border-bottom border-secondary pb-3" id="adminTabs" role="tablist">
            <li class="nav-item"><button class="nav-link active px-4" id="users-tab" data-bs-toggle="tab" data-bs-target="#users" type="button"><i class="fa-solid fa-users me-2"></i> Manage Users (${users.length})</button></li>
            <li class="nav-item"><button class="nav-link px-4" id="admin-schemes-tab" data-bs-toggle="tab" data-bs-target="#admin-schemes" type="button"><i class="fa-solid fa-landmark me-2"></i> Manage Govt Schemes (${schemes.length})</button></li>
            <li class="nav-item"><button class="nav-link px-4" id="logs-tab" data-bs-toggle="tab" data-bs-target="#logs" type="button"><i class="fa-solid fa-list-check me-2"></i> Activity Logs (${logs.length})</button></li>
        </ul>

        <div class="tab-content" id="adminTabContent">
            <div class="tab-pane fade show active" id="users" role="tabpanel">
                <div class="glass-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold text-white mb-0">Registered User Accounts</h5>
                        <div class="w-25"><input type="text" id="userSearchInput" class="form-control form-control-sm" placeholder="Search user..."></div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle mb-0" id="usersTable">
                            <thead><tr class="text-muted small"><th>ID</th><th>Full Name</th><th>Contact</th><th>Occupation</th><th>Income</th><th>State</th><th>Role</th><th>Action</th></tr></thead>
                            <tbody>
                                ${users.length ? users.map(u => `
                                <tr>
                                    <td>#${u.id}</td>
                                    <td><strong class="text-white d-block">${escapeHtml(u.full_name)}</strong><span class="small text-muted">Age: ${u.age} | ${escapeHtml(u.gender)}</span></td>
                                    <td class="small"><div><i class="fa-solid fa-envelope me-1 text-info"></i> ${escapeHtml(u.email)}</div><div><i class="fa-solid fa-phone me-1 text-emerald"></i> ${escapeHtml(u.mobile)}</div></td>
                                    <td><span class="badge bg-secondary">${escapeHtml(u.occupation)}</span></td>
                                    <td class="font-monospace text-emerald">${inr(u.annual_income)}</td>
                                    <td class="small">${escapeHtml(u.state || 'N/A')}</td>
                                    <td><span class="badge bg-info bg-opacity-25 text-info">User</span></td>
                                    <td><button class="btn btn-sm btn-outline-danger" onclick="confirmDeleteUser(${u.id}, '${escapeHtml(u.full_name).replace(/'/g, "\\'")}')"><i class="fa-solid fa-trash"></i></button></td>
                                </tr>`).join('') : `<tr><td colspan="8" class="text-center text-muted py-4">No registered users yet.</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="admin-schemes" role="tabpanel">
                <div class="glass-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold text-white mb-0">Government Schemes Database</h5>
                        <button class="btn btn-sm btn-emerald" data-bs-toggle="modal" data-bs-target="#addSchemeModal"><i class="fa-solid fa-plus me-1"></i> Add New Scheme</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle mb-0">
                            <thead><tr class="text-muted small"><th>Scheme Name</th><th>Category</th><th>Target</th><th>Financial Benefit</th><th>Action</th></tr></thead>
                            <tbody>
                                ${schemes.map(sch => `
                                <tr>
                                    <td><strong class="text-white">${escapeHtml(sch.scheme_name)}</strong></td>
                                    <td><span class="badge bg-info bg-opacity-25 text-info">${escapeHtml(sch.category)}</span></td>
                                    <td class="small text-muted">${escapeHtml(sch.target_occupation)}</td>
                                    <td class="small text-emerald fw-bold">${escapeHtml(sch.financial_benefit)}</td>
                                    <td><button class="btn btn-sm btn-outline-danger" onclick="confirmDeleteScheme(${sch.id}, '${escapeHtml(sch.scheme_name).replace(/'/g, "\\'")}')"><i class="fa-solid fa-trash"></i></button></td>
                                </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="logs" role="tabpanel">
                <div class="glass-card p-4">
                    <h5 class="fw-bold text-white mb-3">System Activity & Audit Logs</h5>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle mb-0 small">
                            <thead><tr class="text-muted"><th>Timestamp</th><th>User ID</th><th>Action</th><th>Details</th></tr></thead>
                            <tbody>
                                ${logs.length ? logs.map(log => `
                                <tr>
                                    <td class="font-monospace text-muted">${new Date(log.created_at).toLocaleString()}</td>
                                    <td>#${log.user_id ?? 'System'}</td>
                                    <td><span class="badge bg-secondary">${escapeHtml(log.action)}</span></td>
                                    <td class="text-muted">${escapeHtml(log.details)}</td>
                                </tr>`).join('') : `<tr><td colspan="4" class="text-center text-muted py-4">No activity recorded yet.</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>`;

        document.getElementById('exportCsvBtn').addEventListener('click', () => FS.exportPredictionsCsv());
    }

    renderAdminPage();

    document.getElementById('addSchemeForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const f = e.target;
        FS.addScheme({
            scheme_name: f.scheme_name.value, category: f.category.value,
            target_occupation: f.target_occupation.value, financial_benefit: f.financial_benefit.value,
            eligibility_criteria: f.eligibility_criteria.value, description: f.description.value,
            official_url: f.official_url.value
        });
        bootstrap.Modal.getInstance(document.getElementById('addSchemeModal')).hide();
        f.reset();
        renderAdminPage();
        showToast('success', 'New Government Scheme added successfully!');
    });
</script>
</body>
</html>
